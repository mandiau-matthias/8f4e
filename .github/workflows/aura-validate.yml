# Reviewed Aura project CI. No wallet, publisher or model credentials belong here.
name: Aura validate prepared contribution
run-name: Aura validate ${{ inputs.target_sha }} ${{ inputs.manifest_sha256 }} ${{ inputs.policy_sha256 }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      policy_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aura-project-validation
  cancel-in-progress: false
jobs:
  validate:
    name: aura-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      POLICY_SHA256: ${{ inputs.policy_sha256 }}
      TEST_IMAGE: node:24.16.0@sha256:40ad9f3064e67d6860b4bc3fe1880b2953934fd6320ada990e45fe0efa6badd7
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$POLICY_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Checkout target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mandiau-matthias/8f4e
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Checkout pinned dependency 1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: andorthehood/glugglugglug
          ref: 19dcee23cedf993c10a4f03de6dbc3a18c9adeb2
          path: packages/editor/packages/editor-core/packages/web-ui/packages/glugglugglug
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Verify target checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f package-lock.json
          test ! -L package-lock.json
          test "$(git ls-tree HEAD -- packages/editor/packages/editor-core/packages/web-ui/packages/glugglugglug | cut -f1)" = "160000 commit 19dcee23cedf993c10a4f03de6dbc3a18c9adeb2"
          test "$(git -C packages/editor/packages/editor-core/packages/web-ui/packages/glugglugglug rev-parse HEAD)" = "19dcee23cedf993c10a4f03de6dbc3a18c9adeb2"
      - name: Fetch pinned test image
        shell: bash
        run: docker pull "$TEST_IMAGE"
      - name: Install locked dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          docker volume create aura-validation-work
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 6g --cpus 2 --read-only --tmpfs /tmp:rw,nosuid,size=512m --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly --mount type=volume,source=aura-validation-work,target=/work --workdir /work "$TEST_IMAGE" env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp sh -c 'cp -a --no-preserve=ownership /source/. /work/ && find /work -name .git -prune -exec rm -rf {} + && npm ci --ignore-scripts --no-audit --no-fund && mkdir -p /work/packages/8f4e-website/dist /work/packages/cli/dist /work/packages/compiler/dist /work/packages/compiler/packages/language-spec/dist /work/packages/compiler/packages/program-composer/dist /work/packages/compiler/packages/project-preparser/dist /work/packages/compiler/packages/stdlib/dist /work/packages/compiler/packages/sub-program/dist /work/packages/compiler/packages/sub-program/packages/constant-resolver/dist /work/packages/compiler/packages/sub-program/packages/memory-default-resolver/dist /work/packages/compiler/packages/sub-program/packages/memory-planner/dist /work/packages/compiler/packages/sub-program/packages/memory-reference-resolver/dist /work/packages/compiler/packages/sub-program/packages/semantic-reference-resolver/dist /work/packages/compiler/packages/sub-program/packages/semantic-utils/dist /work/packages/compiler/packages/sub-program/packages/stack-analyzer/dist /work/packages/compiler/packages/sub-program/packages/tokenizer/dist /work/packages/compiler/packages/wasm-codegen/dist /work/packages/compiler/packages/wasm-codegen/packages/wasm-utils/dist /work/packages/config/dist /work/packages/editor/packages/compiler-worker/dist /work/packages/editor/packages/editor-core/dist /work/packages/editor/packages/editor-core/packages/editor-state-testing/dist /work/packages/editor/packages/editor-core/packages/editor-state-types/dist /work/packages/editor/packages/editor-core/packages/editor-state/dist /work/packages/editor/packag